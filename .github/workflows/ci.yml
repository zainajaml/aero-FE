name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run deps:cycles
      - run: npm run deps:unused
      - name: Schema and migrations in sync
        run: npm run db:check
      - name: OpenAPI contract is committed
        run: npm run openapi:generate && git diff --exit-code openapi/openapi.json
      # Integration tests start Postgres and S3 storage with Testcontainers (Docker is available on the runner).
      - run: npm test
      - run: npm run build
      - name: Production image builds
        run: docker build -t aero-zenith-flow-backend:ci .
